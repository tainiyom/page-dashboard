<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard งานลงคลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --navy:#1e3864; --navy2:#2b4a80; --bg:#f3f5f9; --card:#fff; --ink:#1d2433; --mute:#6b7487;
    --line:#e3e7ef; --red:#d93025; --redbg:#fde7e5; --orange:#e8710a; --orangebg:#feefe0;
    --yellow:#b88a00; --yellowbg:#fff6d6; --green:#188038; --greenbg:#e3f4e8; --gray:#80868b; --graybg:#eef0f3;
    --brand:#06c755;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 14px 40px}
  header{background:var(--navy);color:#fff;padding:14px 0 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header .wrap{display:flex;align-items:center;gap:12px;padding-bottom:0}
  header img{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.6);object-fit:cover;background:#fff}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12.5px;opacity:.8}
  header .sp{flex:1}
  .btn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn.line{background:var(--brand);color:#fff;font-size:16px;padding:12px 22px}
  .btn.small{background:var(--graybg);color:var(--ink);font-size:13px;padding:6px 10px}
  .btn.open{background:var(--navy);color:#fff;font-size:13.5px;padding:8px 12px;white-space:nowrap}
  h2{font-size:16px;margin:22px 2px 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
  h2 .count{background:var(--navy);color:#fff;border-radius:20px;font-size:12px;padding:1px 9px}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:center}
  .kpi .l{font-size:12.5px;color:var(--mute);font-weight:600}
  .kpi .v{font-size:30px;font-weight:800;color:var(--navy);line-height:1.15;margin:2px 0}
  .kpi .s{font-size:11.5px;color:var(--mute)}
  .kpi.alert .v{color:var(--red)}
  .bar{height:7px;background:var(--graybg);border-radius:10px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--green);border-radius:10px}
  .pages{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:760px){.pages{grid-template-columns:1fr 1fr}}
  .pg{background:var(--card);border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--gray);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px}
  .pg.red{border-left-color:var(--red);background:linear-gradient(90deg,var(--redbg),#fff 40%)}
  .pg.orange{border-left-color:var(--orange)} .pg.yellow{border-left-color:#f2b600} .pg.green{border-left-color:var(--green)}
  .pg .top{display:flex;align-items:center;gap:8px}
  .pg .name{font-weight:800;font-size:16px;flex:1}
  .chip{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .chip.red{background:var(--redbg);color:var(--red)} .chip.orange{background:var(--orangebg);color:var(--orange)}
  .chip.yellow{background:var(--yellowbg);color:var(--yellow)} .chip.green{background:var(--greenbg);color:var(--green)}
  .chip.gray{background:var(--graybg);color:var(--gray)}
  .pg .todo{font-size:14px}
  .stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
  .stats b{color:var(--ink)} .stats b.r{color:var(--red)}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .task.over{border-color:#f3b2ad;background:#fff8f7}
  .task .h{display:flex;gap:8px;align-items:flex-start}
  .task .t{font-weight:700;font-size:15px;flex:1}
  .task .meta{font-size:12.5px;color:var(--mute);margin:4px 0 8px}
  .task .acts{display:flex;flex-wrap:wrap;gap:6px}
  .task details{margin-top:8px}
  .task summary{cursor:pointer;font-size:13px;color:var(--navy2);font-weight:600}
  .cap{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
  .prob{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .prob .i{flex:1;font-size:13.5px} .prob .i b{font-size:14px}
  .prob .i .w{color:var(--red);font-weight:600}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
  .cols{display:flex;align-items:flex-end;gap:4px;height:150px;position:relative;border-bottom:1px solid var(--line)}
  .cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .cols .c i{display:block;width:100%;max-width:34px;background:#3d72cc;border-radius:6px 6px 0 0;min-height:2px}
  .cols .c span{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .cols .tg{position:absolute;left:0;right:0;border-top:2px dashed var(--orange)}
  .cols .tg em{position:absolute;right:0;top:-18px;font-size:11px;color:var(--orange);font-style:normal;font-weight:700}
  .xl{display:flex;gap:4px;margin-top:4px}.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--mute)}
  .center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
  .center .big{font-size:52px}
  .center h3{margin:0;font-size:20px;color:var(--navy)}
  .center p{margin:0;color:var(--mute);max-width:360px;line-height:1.6}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
  .toast.on{opacity:.95}
  .spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .tabs{display:flex;gap:8px;margin-top:16px;overflow-x:auto}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap;cursor:pointer}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .foot{text-align:center;color:var(--mute);font-size:12px;margin-top:28px}
.btn.sub{background:#06C755;color:#fff;border:none;font-weight:700;font-size:13px;padding:6px 12px}
.sublink{margin-top:8px;padding:8px 10px;border-radius:10px;background:#E8F8EE;color:#0b6b33;font-size:13px;word-break:break-all;cursor:pointer}
.pgn{font-weight:800;color:#1B2B4B;text-decoration:none}
a.pgn{color:#0F1E3D;text-decoration:underline;text-decoration-color:#1877F2;text-underline-offset:3px}
a.pgn .fb{font-size:.8em;color:#1877F2}
.meta .pgn{font-size:14.5px}
.tabs .dot{background:#E8590C;color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
.ucard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ucard.pend{border-left:6px solid #f08c00}
.uh{display:flex;align-items:center;gap:10px}
.uh img,.noimg{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#eef1f6;display:flex;align-items:center;justify-content:center}
.uf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.uf label{font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.uf input,.uf select{font:inherit;font-size:14.5px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}
.upages{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pchk{font-size:13.5px;background:#f3f5f9;border-radius:16px;padding:4px 10px;display:flex;align-items:center;gap:5px}
.pgrp{width:100%;font-size:12.5px;color:var(--mute);margin-top:6px;font-weight:700}
.donebox{margin-top:12px}.donebox summary{cursor:pointer;font-weight:700;color:var(--green);padding:8px 0}
.kpis.share{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.kpis.share{grid-template-columns:repeat(2,1fr)}}
.tabs.sm{margin-top:4px}.tabs.sm button{padding:5px 12px;font-size:13px}
.btn.ghost.live{font-size:13px;padding:6px 10px;margin-right:6px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:center;gap:10px;font-size:16.5px}.ph .sp{flex:1}
.rank{width:26px;height:26px;border-radius:50%;background:#1B2B4B;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
.score{font-size:26px;font-weight:800;line-height:1;text-align:right}.score small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.score.green{color:var(--green)}.score.yellow{color:#c99700}.score.red{color:var(--red)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid>div{background:#f5f7fb;border-radius:10px;padding:7px 9px}.pgrid .l{font-size:12px;color:var(--mute)}.pgrid .v{font-size:17px;font-weight:800}.pgrid .v.bad{color:var(--red)}
.warnbox{background:#FFF4E5;border:1px solid #f5c38a;color:#8a4b00;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.how{margin-top:8px}.how summary{cursor:pointer;color:var(--mute);font-size:13.5px}
.chip.gray{background:#eef1f6;color:var(--mute)}
.tabs.plat{margin-top:14px}.tabs.plat button{font-size:15px;padding:8px 16px}
.tabs.subt{margin-top:8px;padding:6px;background:#e9edf5;border-radius:24px;display:inline-flex;max-width:100%}
.tabs.subt button{border:none;background:transparent;font-size:13.5px;padding:6px 12px}
.tabs.subt button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ghead{margin-top:16px}.ghead h2{margin:0}
.pgbox{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}.pgbox summary{cursor:pointer;font-weight:700}
.pglist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:10px}
.pgi{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;border-radius:10px;background:#f6f8fb;font-size:14px}
.pgi.red{background:#fdecec}.pgi.yellow{background:#fff8e1}.pgi.green{background:#eaf7ef}
.pgrp a{font-weight:600;margin-left:6px;color:#1877F2}
.stats b.bad{color:var(--red)}
.plogo{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:7px;display:inline-flex;align-items:center;justify-content:center;background:#eef1f6;font-size:12px;border:1px solid #e3e7ef}
.pg .name .plogo{width:30px;height:30px}
a.pgn{text-decoration:none}a.pgn:hover{text-decoration:underline;text-decoration-color:#1877F2}
.spark{position:relative;display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:4px;padding-top:4px}
.spark i{flex:1;background:#3b5bdb;border-radius:3px 3px 0 0;opacity:.85}
.spark em{position:absolute;left:0;right:0;border-top:1.5px dashed #e8590c}
.myday{position:relative;margin-top:12px;background:linear-gradient(135deg,#eef3ff,#fff);border:1px solid #d6e0ff;border-radius:16px;padding:14px 16px}
.myday.load{color:var(--mute);font-size:14px}
.myday .x{position:absolute;top:8px;right:10px;border:none;background:none;font-size:15px;color:var(--mute);cursor:pointer}
.mrow{display:flex;gap:14px;align-items:center}
.mscore{min-width:84px;text-align:center;font-size:34px;font-weight:800;line-height:1}.mscore small{display:block;font-size:11px;color:var(--mute);font-weight:600;margin-top:4px}
.mscore.green{color:var(--green)}.mscore.yellow{color:#c99700}.mscore.red{color:var(--red)}.mscore.gray{color:var(--mute)}
.minfo{flex:1}.mt{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ms{font-size:14px;margin-top:4px}.mtip{font-size:13.5px;color:#5a4300;margin-top:6px}
.mteam{margin-top:10px;padding-top:10px;border-top:1px dashed #cdd6ee;font-size:14px}
.mteam.solo{margin-top:0;padding-top:0;border-top:none;padding-right:20px}
.mfoot{margin-top:8px;text-align:right}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div><p>กำลังเข้าสู่ระบบด้วย LINE…</p></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== ตั้งค่า (ใส่หลังสร้าง LIFF และ deploy Apps Script แล้ว) ===== */
const CONFIG = {
  LIFF_ID: '2012003271-2BEaBXBu',
  API_URL: 'https://script.google.com/macros/s/AKfycbwh19gGjyTtxY2oSor5P4QmRuNjq4wqitQlxZaXwkBzk8799-x_bSKy_jDQrgByu6g7UA/exec'
};
/* ================================================================== */

const $app = document.getElementById('app');
let DATA = null, VIEW = 'home';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function tone(s){s=s||'';if(s.startsWith('🔴'))return'red';if(s.startsWith('🟠'))return'orange';if(s.startsWith('🟡'))return'yellow';if(s.startsWith('🟢'))return'green';return'gray'}
let LOGOS={};
try{const c=JSON.parse(localStorage.getItem('pd_logos')||'null');if(c&&Date.now()-c.t<6*3600e3)LOGOS=c.l||{};}catch(e){}
async function loadLogos(){try{const r=await api({action:'logos'});if(r.ok){LOGOS=r.logos||{};try{localStorage.setItem('pd_logos',JSON.stringify({t:Date.now(),l:LOGOS}))}catch(e){}if(DATA)render();}}catch(e){}}
function fbId(fb){const m=String(fb||'').match(/id=(\d+)/);return m?m[1]:''}
function logoImg(fb){const l=LOGOS[fbId(fb)];return l?`<img class="plogo" src="${l}" alt="">`:`<span class="plogo none">📄</span>`}
function pageLink(name,fb){
  return fb?`<a class="pgn" href="#" onclick="event.preventDefault();openUrl('${esc(fb)}')">${logoImg(fb)}${esc(name)} <span class="fb">↗</span></a>`:`<b class="pgn">${esc(name)}</b>`;
}
function openUrl(u){if(!u)return;if(window.liff&&liff.isInClient&&liff.isInClient()){liff.openWindow({url:u,external:true})}else{window.open(u,'_blank')}}
async function copy(t,label){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast('คัดลอก'+(label||'')+'แล้ว ✅')
}

function screen(icon,title,text,btn){
  $app.innerHTML=`<div class="center"><div class="big">${icon}</div><h3>${esc(title)}</h3><p>${text}</p>${btn||''}</div>`;
}

async function boot(){
  try{
    await liff.init({liffId:CONFIG.LIFF_ID});
    if(!liff.isLoggedIn()){
      screen('🟩','เข้าสู่ระบบ','ใช้บัญชี LINE ของคุณเข้าดู Dashboard งานลงคลิป',
        `<button class="btn line" onclick="liff.login({redirectUri:location.href})">เข้าสู่ระบบด้วย LINE</button>`);
      return;
    }
    await load();
  }catch(e){
    screen('⚠️','เปิดระบบไม่ได้','ลองเปิดลิงก์ใหม่อีกครั้ง หรือแจ้งหัวหน้า<br><small>'+esc(e.message||e)+'</small>',
      `<button class="btn small" onclick="location.reload()">ลองใหม่</button>`);
  }
}

// กลับมาหน้านี้ (เช่น หลังไปสร้างลิงก์ในไฟล์เพจ) ให้ดึงข้อมูลใหม่เอง
let LAST_LOAD=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&DATA&&Date.now()-LAST_LOAD>15000){load();loadMyDay();if(PLAT==='meta'&&SUB==='fbA')loadShare();if(PLAT==='shopee'&&SUB==='video')loadVideo();if(PLAT==='perf')loadPerf();}
});
async function load(){
  LAST_LOAD=Date.now();
  const token=liff.getIDToken();
  if(!token){liff.login({redirectUri:location.href});return}
  if(!DATA) screen('⏳','กำลังโหลดข้อมูล…','ดึงสถานะงานล่าสุดจากทุกเพจ');
  let res;
  try{
    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'data',token})});
    res=await r.json();
  }catch(e){
    screen('📶','เชื่อมต่อไม่ได้','ตรวจอินเทอร์เน็ตแล้วลองใหม่',`<button class="btn small" onclick="load()">ลองใหม่</button>`);return;
  }
  if(!res.ok){
    if(res.error==='LOGIN_EXPIRED'||res.error==='NO_TOKEN'){liff.logout();liff.login({redirectUri:location.href});return}
    screen('⚠️','ระบบขัดข้อง',esc(res.error),`<button class="btn small" onclick="load()">ลองใหม่</button>`);return;
  }
  const me=res.me||{};
  if(res.state==='pending'){
    screen('⏳','รออนุมัติการเข้าใช้งาน',`สวัสดีคุณ <b>${esc(me.lineName)}</b><br>ระบบส่งชื่อของคุณให้หัวหน้าแล้ว เมื่ออนุมัติแล้วกดปุ่มด้านล่างเพื่อเข้าใช้งาน`,
      `<button class="btn small" onclick="load()">ตรวจสอบอีกครั้ง</button>`);return;
  }
  if(res.state==='blocked'){
    screen('🔒','บัญชีนี้ถูกปิดการเข้าใช้งาน','หากคิดว่าผิดพลาด กรุณาติดต่อหัวหน้า');return;
  }
  if(!DATA&&res.pages&&!res.pages.length&&!res.seeAll){SUB='fbA';loadShare();}
  if(!DATA&&!Object.keys(LOGOS).length) setTimeout(loadLogos,300);
  if(!DATA) setTimeout(loadMyDay,100);
  DATA=res; render();
}

/* ===== แชร์ลิงก์เพจป้ายยา ===== */
let SHARE=null, SHARE_BUSY=false;
async function loadShare(){
  if(SHARE_BUSY) return; SHARE_BUSY=true;
  try{const res=await api({action:'share'}); SHARE=res.ok?res:{error:res.error};}
  catch(e){SHARE={error:'เชื่อมต่อไม่ได้'}}
  SHARE_BUSY=false; if(DATA) render();
}
function shareView(){
  if(!SHARE) return `<h2>🛒 แชร์ลิงก์เพจป้ายยา</h2><div class="empty">⏳ กำลังโหลดงานแชร์ลิงก์…</div>`;
  if(SHARE.error) return `<h2>🛒 แชร์ลิงก์เพจป้ายยา</h2><div class="empty">โหลดไม่ได้: ${esc(SHARE.error)} <button class="btn small" onclick="SHARE=null;loadShare();render()">ลองใหม่</button></div>`;
  const k=SHARE.kpi, it=SHARE.items, todo=it.filter(x=>!x.posted), done=it.filter(x=>x.posted);
  const pct=k.today?Math.round(k.posted/k.today*100):0;
  let head=`<h2>🛒 แชร์ลิงก์เพจป้ายยา <span class="count">${k.pages} เพจ</span></h2>
  <div class="kpis share">
    <div class="kpi"><div class="l">✅ โพสต์แล้ววันนี้</div><div class="v">${k.posted}</div><div class="s">จาก ${k.today} งาน</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="kpi"><div class="l">📝 รอโพสต์วันนี้</div><div class="v">${k.pending}</div><div class="s">${esc(SHARE.today)}</div></div>
    <div class="kpi ${k.overdue?'alert':''}"><div class="l">⏰ ค้างจากวันก่อน</div><div class="v">${k.overdue}</div><div class="s">${k.overdue?'โพสต์ก่อนงานวันนี้':'ไม่มีงานค้าง 👍'}</div></div>
    <div class="kpi ${k.noSub?'alert':''}"><div class="l">🔗 ยังไม่มีลิงก์แชร์</div><div class="v">${k.noSub}</div><div class="s">ภาพยังไม่พร้อม ${k.noImage}</div></div>
  </div>`;
  if(!k.today&&!todo.length) return head+`<div class="empty">ยังไม่มีงานแชร์ลิงก์ของวันนี้${SHARE.latest?` (งานล่าสุด ${esc(SHARE.latest.split('-').reverse().join('/'))})`:''} · งานจะขึ้นเมื่อมีการเติมงานในไฟล์</div>`;

}

    <div class="h"><div class="t">${pageLink(t.page,t.fb)}</div>${chip}</div>

    <div class="acts">

      ${/^http/.test(t.subLink)?`<button class="btn sub" onclick="copy(SHARE.items[${i}].subLink,'ลิงก์แชร์')">🔗 คัดลอกลิงก์แชร์</button>`:'<span class="chip orange">⏳ ยังไม่มีลิงก์แชร์</span>'}
      <button class="btn open" onclick="openUrl('${esc(t.url)}')">📂 บันทึกในไฟล์ (แถว ${t.row})</button>
    </div>
    ${/^http/.test(t.subLink)?`<div class="sublink" onclick="copy(SHARE.items[${i}].subLink,'ลิงก์แชร์')">🔗 ${esc(t.subLink)}</div>`:`<div class="meta">👉 สร้างลิงก์แชร์จาก NAGAcare แล้ววางในคอลัมน์ L ของแถว ${t.row}</div>`}
    <div class="meta">👉 โพสต์เสร็จ: เปลี่ยนสถานะเป็น "โพสต์แล้ว" + วางลิงก์โพสต์ในคอลัมน์ K</div>
    ${t.caption?`<details><summary>ดูแคปชัน / หมายเหตุ</summary><div class="cap">${esc(t.caption)}</div>${t.note?`<div class="meta">📝 ${esc(t.note)}</div>`:''}</details>`:''}`}
  </div>`;
}

let MYDAY=null, MYDAY_HIDE=false;
async function loadMyDay(){
  try{const r=await api({action:'perf',period:'today'}); MYDAY=r.ok?r:null;}catch(e){MYDAY=null}
  if(DATA) render();
}
function myDayCard(){
  if(MYDAY_HIDE||PLAT==='perf') return '';
  if(!MYDAY) return `<div class="myday load">⏳ กำลังคำนวณผลงานวันนี้…</div>`;
  const d=MYDAY, me=d.people.find(p=>p.name===d.myName);
  const close=`<button class="x" onclick="MYDAY_HIDE=true;render()" title="ซ่อน">✕</button>`;
  const more=`<button class="btn small" onclick="go('perf')">ดูผลงานเต็ม →</button>`;
  let mine='';
  if(me){
    const g=grade(me.score);
    const parts=[];
    if(me.reel.done) parts.push(`🎬 คลิป Reel <b>${me.reel.done}</b>`);
    if(me.share.done) parts.push(`🛒 แชร์ลิงก์ <b>${me.share.done}</b>`);
    if(me.video.target) parts.push(`📹 วิดีโอ <b>${me.video.done}/${me.video.target}</b>`);
    const tips=[];
    if(me.onTimePct!=null&&me.onTimePct<100) tips.push('มีงานลงช้ากว่ากำหนด');
    if(me.completePct!=null&&me.completePct<100) tips.push('มีงานที่ยังกรอกไม่ครบ (ลิงก์โพสต์/ลิงก์ Sub ID)');
    if(me.video.target&&me.video.done<me.video.target) tips.push(`วิดีโอขาดอีก ${me.video.target-me.video.done} คลิป`);
    if(me.video.backlog>=10) tips.push(`วิดีโอค้างสะสม ${me.video.backlog} คลิป`);
    mine=`<div class="mrow"><div class="mscore ${g[0]}">${me.score==null?'—':me.score}<small>คะแนนวันนี้</small></div>
      <div class="minfo"><div class="mt">ผลงานของฉันวันนี้ <span class="chip ${g[0]}">${g[1]}</span></div>
      <div class="ms">${parts.join(' · ')||'ยังไม่มีงานที่ลงวันนี้'}${me.onTimePct!=null?` · ตรงเวลา <b>${me.onTimePct}%</b> · ครบถ้วน <b>${me.completePct}%</b>`:''}</div>
      <div class="mtip">${tips.length?'👉 '+tips.join(' · '):'👍 วันนี้เรียบร้อยดี ทำต่อแบบนี้เลย'}</div></div></div>`;
  }else if(!d.boss){
    mine=`<div class="mrow"><div class="mscore gray">—<small>คะแนนวันนี้</small></div><div class="minfo"><div class="mt">ผลงานของฉันวันนี้</div>
      <div class="ms">ยังไม่พบงานที่ลงวันนี้ในชื่อ "<b>${esc(d.myName)}</b>"</div>
      <div class="mtip">👉 ลงงานเสร็จแล้ว ใส่ชื่อ "${esc(d.myName)}" ในช่องผู้อัป / ผู้โพสต์ ระบบจะนับให้</div></div></div>`;
  }
  let team='';
  if(d.boss){
    const sc=d.people.filter(p=>p.score!=null);
    const avg=sc.length?Math.round(sc.reduce((a,p)=>a+p.score,0)/sc.length):null;
    const low=d.people.filter(p=>p.total&&p.score!=null&&p.score<60).map(p=>p.name);
    const none=d.people.filter(p=>!p.total).map(p=>p.name);
    team=`<div class="mteam${mine?'':' solo'}">👥 ทีมวันนี้ ${d.people.length} คน · คะแนนเฉลี่ย <b>${avg==null?'—':avg}</b>${low.length?` · 🔴 ต้องปรับ: <b>${low.map(esc).join(', ')}</b>`:''}${none.length?` · ⏳ ยังไม่มีงานวันนี้: ${none.map(esc).join(', ')}`:''}</div>`;
  }
  return `<div class="myday">${close}${mine}${team}<div class="mfoot">${more}</div></div>`;
}

/* ===== ผลงานพนักงาน ===== */
let PERF=null, PERF_P='week', PERF_BUSY=false;
async function loadPerf(p){
  if(p) PERF_P=p;
  if(PERF_BUSY) return; PERF_BUSY=true; PERF=null; if(DATA) render();
  try{const res=await api({action:'perf',period:PERF_P}); PERF=res.ok?res:{error:res.error};}
  catch(e){PERF={error:'เชื่อมต่อไม่ได้'}}
  PERF_BUSY=false; if(DATA) render();
}
function grade(sc){return sc==null?['gray','—']:sc>=85?['green','🟢 ดีมาก']:sc>=60?['yellow','🟡 พอใช้']:['red','🔴 ต้องปรับ']}
function pct(v){return v==null?'—':v+'%'}
function perfView(){
  const per=[['today','วันนี้'],['week','7 วัน'],['month','เดือนนี้']];
  const sw=`<div class="tabs sm">${per.map(x=>`<button class="${PERF_P===x[0]?'on':''}" onclick="loadPerf('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
  const title=`<h2>📈 ผลงานพนักงาน</h2>${sw}`;
  if(!PERF) return title+`<div class="empty">⏳ กำลังคำนวณผลงาน…</div>`;
  if(PERF.error) return title+`<div class="empty">โหลดไม่ได้: ${esc(PERF.error)} <button class="btn small" onclick="loadPerf()">ลองใหม่</button></div>`;
  const d=PERF;
  const how=`<details class="how"><summary>คะแนนคิดยังไง?</summary><div class="meta">คะแนน = เฉลี่ยของ ① ลงตรงเวลา (ไม่เลยวันที่กำหนด) ② งานครบถ้วน (ใส่ลิงก์โพสต์ ลิงก์ Sub ID ติ๊กป้าย AI ครบ) ③ คลิปวิดีโอ Shopee ทำได้ตามเป้า · 🟢 85 ขึ้นไป · 🟡 60–84 · 🔴 ต่ำกว่า 60<br>ระบบนับงานจากชื่อในช่อง "ผู้อัป" (ไฟล์เพจ Reel) และ "ผู้โพสต์" (ไฟล์งานแชร์) ต้องตรงกับชื่อเล่นในระบบ · วิดีโอนับตามผู้ดูแลช่อง</div></details>`;
  if(!d.people.length){
    return title+`<div class="empty">${d.boss?'ยังไม่มีผลงานในช่วงนี้':`ยังไม่พบผลงานของ "${esc(d.myName)}" ในช่วงนี้<br><small>ตอนบันทึกงาน ให้ใส่ชื่อ "${esc(d.myName)}" ในช่อง ผู้อัป / ผู้โพสต์</small>`}</div>`+how;
  }
  const rows=d.people.map((p,i)=>{
    const g=grade(p.score);
    return `<div class="pcard">
      <div class="ph">${d.boss?`<span class="rank">${i+1}</span>`:''}<b>${esc(p.name)}</b><span class="sp"></span><span class="score ${g[0]}">${p.score==null?'—':p.score}<small>คะแนน</small></span></div>
      <div class="chip ${g[0]}" style="align-self:flex-start">${g[1]}</div>
      <div class="pgrid">
        <div><div class="l">🎬 คลิป Reel</div><div class="v">${p.reel.done}</div></div>
        <div><div class="l">🛒 แชร์ลิงก์</div><div class="v">${p.share.done}</div></div>
        <div><div class="l">📹 วิดีโอ Shopee</div><div class="v">${p.video.target?p.video.done+' / '+p.video.target:'—'}</div></div>
        <div><div class="l">⏱️ ตรงเวลา</div><div class="v">${pct(p.onTimePct)}</div></div>
        <div><div class="l">✅ ครบถ้วน</div><div class="v">${pct(p.completePct)}</div></div>
        <div><div class="l">📦 วิดีโอค้าง</div><div class="v ${p.video.backlog>=10?'bad':''}">${p.video.target?p.video.backlog:'—'}</div></div>
      </div>
      ${p.video.channels.length?`<div class="meta">ช่องที่ดูแล: ${p.video.channels.map(c=>esc(c.name.replace(/\s*\(.*\)/,''))+' '+c.done+'/'+c.target).join(' · ')}</div>`:''}
    </div>`;}).join('');
  return title+`<div class="meta" style="margin:-2px 0 10px">ช่วง ${esc(d.start.split('-').reverse().join('/'))} – ${esc(d.today.split('-').reverse().join('/'))}${d.videoNote?' · '+esc(d.videoNote):''}</div>
    ${d.unnamed?`<div class="warnbox">⚠️ มีงานที่ลงแล้วแต่ไม่ได้ใส่ชื่อผู้ลง ${d.unnamed.posted} งาน (Reel ${d.unnamed.reel.done} · แชร์ลิงก์ ${d.unnamed.share.done}) — งานพวกนี้ยังไม่ถูกนับให้ใคร</div>`:''}
    ${rows}${how}`;
}

/* ===== หลังบ้านแอดมิน ===== */
let USERS=null, USERS_BUSY=false;
async function api(body){
  const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:liff.getIDToken()},body))});
  return r.json();
}
async function loadUsers(){
  if(USERS_BUSY) return; USERS_BUSY=true;
  try{const res=await api({action:'users'}); USERS=res.ok?res:{error:res.error};}
  catch(e){USERS={error:'เชื่อมต่อไม่ได้'}}
  USERS_BUSY=false; if(PLAT==='users') render();
}
function usersView(){
  if(!USERS) return `<h2>👤 ผู้ใช้งาน</h2><div class="empty">⏳ กำลังโหลดรายชื่อ…</div>`;
  if(USERS.error) return `<h2>👤 ผู้ใช้งาน</h2><div class="empty">โหลดไม่ได้: ${esc(USERS.error)} <button class="btn small" onclick="USERS=null;loadUsers();render()">ลองใหม่</button></div>`;
  const ord={'รออนุมัติ':0,'อนุมัติ':1,'ปิด':2};
  const list=[...USERS.users].sort((a,b)=>(ord[a.status]??0)-(ord[b.status]??0));
  const pend=list.filter(u=>u.status==='รออนุมัติ').length;
  return `<h2>👤 ผู้ใช้งาน <span class="count">${list.length}</span>${pend?` <span class="chip orange">รออนุมัติ ${pend} คน</span>`:''}</h2>
  <div class="meta" style="margin:-4px 0 10px">พนักงานเปิดลิงก์แล้วล็อกอิน LINE ชื่อจะขึ้นที่นี่ · ใส่ชื่อเล่น เลือกเพจ แล้วกด ✅ อนุมัติ</div>
  ${list.map((u,i)=>userCard(u,USERS.users.indexOf(u))).join('')}`;
}
function userCard(u,i){
  const mine=u.pages.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  const all=/ทั้งหมด/.test(u.pages);
  const tone=u.status==='รออนุมัติ'?'orange':u.status==='ปิด'?'red':'green';
  return `<div class="ucard ${u.status==='รออนุมัติ'?'pend':''}" id="u${i}">
    <div class="uh">${u.picture?`<img src="${esc(u.picture)}" alt="">`:'<div class="noimg">👤</div>'}
      <div style="flex:1"><b>${esc(u.lineName)}</b>${u.self?' <span class="chip">คุณ</span>':''}<div class="meta">เข้าล่าสุด ${esc(shortDate(u.last))} · ครั้งแรก ${esc(shortDate(u.first))}</div></div>
      <span class="chip ${tone}">${esc(u.status)}</span></div>
    <div class="uf">
      <label>ชื่อเล่น<input data-k="nick" value="${esc(u.nick)}" placeholder="เช่น น้องมิ้น"></label>
      <label>บทบาท<select data-k="role" ${u.self?'disabled':''}>${['พนักงาน','หัวหน้า','แอดมิน'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label>
    </div>
    <div class="meta" style="margin-top:6px">เพจที่ดูแล</div>
    <div class="upages"><label class="pchk"><input type="checkbox" data-all ${all?'checked':''} onchange="toggleAll(${i},this.checked)"> ทั้งหมด</label>
      <div class="pgrp">📘 FB Affiliate Group B (${USERS.pageNames.length} เพจ) <a href="#" onclick="event.preventDefault();pickGroup(${i},'B')">เลือกทั้งกลุ่ม</a></div>
      ${USERS.pageNames.map(n=>`<label class="pchk"><input type="checkbox" data-p="${esc(n)}" ${all||mine.indexOf(n)>=0?'checked':''} ${all?'disabled':''}> ${esc(n)}</label>`).join('')}
      ${(USERS.videoNames||[]).length?`<div class="pgrp">🛍️ Shopee Video (${USERS.videoNames.length} ช่อง)</div>`+USERS.videoNames.map(n=>`<label class="pchk"><input type="checkbox" data-p="${esc(n)}" ${all||mine.indexOf(n)>=0?'checked':''} ${all?'disabled':''}> ${esc(n.replace(/\s*\(.*\)/,''))}</label>`).join(''):''}
      ${(USERS.sharePageNames||[]).length?`<div class="pgrp">📘 FB Affiliate Group A (${USERS.sharePageNames.length} เพจ) <a href="#" onclick="event.preventDefault();pickGroup(${i},'A')">เลือกทั้งกลุ่ม</a></div>`+USERS.sharePageNames.map(n=>`<label class="pchk"><input type="checkbox" data-p="${esc(n)}" ${all||mine.indexOf(n)>=0?'checked':''} ${all?'disabled':''}> ${esc(n)}</label>`).join(''):''}</div>
    <div class="acts" style="margin-top:10px">
      ${u.self?'':(u.status==='อนุมัติ'?`<button class="btn small" onclick="saveUser(${i},'ปิด')">🔒 ปิดสิทธิ์</button>`:`<button class="btn sub" onclick="saveUser(${i},'อนุมัติ')">✅ อนุมัติ</button>`)}
      <button class="btn open" onclick="saveUser(${i})">💾 บันทึก</button>
    </div>
  </div>`;
}
function shortDate(v){const d=new Date(v);return isNaN(d)?v:d.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function pickGroup(i,g){const names=g==='A'?USERS.sharePageNames:USERS.pageNames;document.querySelectorAll(`#u${i} [data-p]`).forEach(c=>{if(names.indexOf(c.dataset.p)>=0&&!c.disabled)c.checked=true})}
function toggleAll(i,on){document.querySelectorAll(`#u${i} [data-p]`).forEach(c=>{c.disabled=on;if(on)c.checked=true})}
async function saveUser(i,status){
  const u=USERS.users[i], el=document.getElementById('u'+i);
  const all=el.querySelector('[data-all]').checked;
  const pages=all?'ทั้งหมด':[...el.querySelectorAll('[data-p]:checked')].map(c=>c.dataset.p).join(', ');
  const role=el.querySelector('[data-k=role]').value;
  const nick=el.querySelector('[data-k=nick]').value.trim();
  const st=status||u.status;
  if(st==='อนุมัติ'&&role==='พนักงาน'&&!pages){toast('เลือกเพจที่ดูแลก่อนนะ');return}
  toast('กำลังบันทึก…');
  try{
    const res=await api({action:'setUser',id:u.id,nick,role,pages,status:st});
    if(!res.ok){toast(res.error==='CANNOT_LOCK_SELF'?'ปิดสิทธิ์ตัวเองไม่ได้':'บันทึกไม่ได้: '+res.error);return}
    Object.assign(u,{nick,role,pages,status:st}); toast('บันทึกแล้ว ✅');
    DATA.pendingUsers=USERS.users.filter(x=>x.status==='รออนุมัติ').length; render();
  }catch(e){toast('เชื่อมต่อไม่ได้')}
}

/* ===== โครงเมนู: แพลตฟอร์ม → กลุ่ม → เพจ/ช่อง ===== */
const NAVS={
  meta:{label:'Meta',icon:'📘',subs:[['official','FB Page Official'],['fbA','FB Affiliate Group A'],['fbB','FB Affiliate Group B']]},
  shopee:{label:'Shopee',icon:'🛍️',subs:[['live','Live'],['video','Video']]},
  tiktok:{label:'TikTok',icon:'🎵',subs:[['live','Live'],['video','Video']]},
  line:{label:'LINE',icon:'💬',subs:[['oa','LINE OA']]}
};
let PLAT='meta', SUB='fbB', INNER='home', VIDEO=null, VIDEO_BUSY=false;
function go(plat,sub){
  if(plat==='perf'||plat==='users'){PLAT=plat;}else{PLAT=plat;SUB=sub||NAVS[plat].subs[0][0];}
  if(PLAT==='users')loadUsers(); if(PLAT==='perf'&&!PERF)loadPerf();
  if(PLAT==='meta'&&SUB==='fbA')loadShare(); if(PLAT==='shopee'&&SUB==='video')loadVideo(); if(PLAT==='shopee'&&SUB==='live')loadLive();
  render();scrollTo(0,0);
}
async function loadVideo(){
  if(VIDEO_BUSY) return; VIDEO_BUSY=true;
  try{const res=await api({action:'video'}); VIDEO=res.ok?res:{error:res.error};}catch(e){VIDEO={error:'เชื่อมต่อไม่ได้'}}
  VIDEO_BUSY=false; if(DATA) render();
}
function reelKpis(d){
  const k=d.kpi, p=k.targetToday?Math.min(100,Math.round(k.doneToday/k.targetToday*100)):0;
  return `<div class="kpis">
      <div class="kpi"><div class="l">✅ ลงแล้ววันนี้</div><div class="v">${k.doneToday}</div><div class="s">เป้า ${k.targetToday} คลิป</div><div class="bar"><i style="width:${p}%"></i></div></div>
      <div class="kpi"><div class="l">🎬 ต้องลงวันนี้</div><div class="v">${k.due}</div><div class="s">รอล่วงหน้า ${k.upcoming}</div></div>
      <div class="kpi ${k.overdue?'alert':''}"><div class="l">⏰ เลยกำหนด</div><div class="v">${k.overdue}</div><div class="s">${k.overdue?'ต้องลงด่วน!':'ไม่มีงานลืมลง 👍'}</div></div>
      <div class="kpi ${k.urgent?'alert':''}"><div class="l">⚠️ งานมีปัญหา</div><div class="v">${k.issues}</div><div class="s">ด่วน ${k.urgent}</div></div>
      <div class="kpi"><div class="l">🎯 Reels เดือนนี้</div><div class="v">${k.reels}</div><div class="s">${k.reelsNext?esc(k.reelsNext)+' (อีก '+esc(k.reelsNeed)+')':'คลิปของเพจที่ดูแล'}</div></div>
      <div class="kpi ${k.redPages?'alert':''}"><div class="l">🚦 เพจต้องรีบ</div><div class="v">${k.redPages}</div><div class="s">จาก ${k.totalPages} เพจ</div></div>
    </div>`;
}
function groupB(d){
  const inner=[['home',`📋 รายเพจ (${d.pages.length})`],['tasks',`🎬 งานวันนี้ (${d.tasks.length})`],['probs',`⚠️ ปัญหา (${d.problems.length})`]];
  const body=INNER==='tasks'?tasksView(d):INNER==='probs'?probsView(d):homeView(d);
  return `<div class="ghead"><h2>FB Affiliate Group B <span class="count">${d.pages.length} เพจ</span></h2><div class="meta">เพจคลิป Reel · ลงวันละ 3 คลิป/เพจ พร้อมปักตะกร้า</div></div>
    ${reelKpis(d)}
    <div class="tabs sm">${inner.map(t=>`<button class="${INNER===t[0]?'on':''}" onclick="INNER='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
    ${body}`;
}
function groupA(){
  let grid='';
  if(SHARE&&SHARE.pageStatus){
    const lab={done:['green','✅ โพสต์แล้ว'],pending:['yellow','📝 รอโพสต์'],overdue:['red','⏰ ค้าง'],none:['gray','— ไม่มีงานวันนี้']};
    const ord={overdue:0,pending:1,done:2,none:3};
    const ps=[...SHARE.pageStatus].sort((a,b)=>ord[a.status]-ord[b.status]||a.name.localeCompare(b.name,'th'));
    grid=`<details class="pgbox" ${SHARE.kpi&&SHARE.kpi.today?'':'open'}><summary>📋 รายชื่อ ${ps.length} เพจ และสถานะวันนี้</summary><div class="pglist">${ps.map(x=>`<div class="pgi ${lab[x.status][0]}">${pageLink(x.name,x.fb)}<span class="chip ${lab[x.status][0]}">${lab[x.status][1]}</span></div>`).join('')}</div></details>`;
  }
  return `<div class="ghead"><h2>FB Affiliate Group A</h2><div class="meta">เพจแชร์ลิงก์ (ป้ายยา) · 1 โพสต์/เพจ/วัน · แปะลิงก์ในคอมเมนต์</div></div>`+shareView().replace(/^<h2>[\s\S]*?<\/h2>/,'')+grid;
}
function videoView(){
  const head=`<div class="ghead"><h2>Shopee Video</h2><div class="meta">ช่องวิดีโอ Shopee · เป้าวันละ 5 คลิป/ช่อง (จ.–ศ.)</div></div>`;
  if(!VIDEO) return head+`<div class="empty">⏳ กำลังโหลดช่องวิดีโอ…</div>`;
  if(VIDEO.error) return head+`<div class="empty">โหลดไม่ได้: ${esc(VIDEO.error)} <button class="btn small" onclick="VIDEO=null;loadVideo();render()">ลองใหม่</button></div>`;
  const k=VIDEO.kpi, p=k.target?Math.min(100,Math.round(k.today/k.target*100)):0;
  const ch=[...VIDEO.channels].sort((a,b)=>(a.today/(a.target||1))-(b.today/(b.target||1))||b.backlog-a.backlog);
  return head+`<div class="kpis share">
    <div class="kpi"><div class="l">🎬 คลิปวันนี้</div><div class="v">${k.today}</div><div class="s">เป้า ${k.target}</div><div class="bar"><i style="width:${p}%"></i></div></div>
    <div class="kpi"><div class="l">📅 สัปดาห์นี้</div><div class="v">${k.week}</div><div class="s">เป้า ${k.weekTarget}</div></div>
    <div class="kpi ${k.backlog?'alert':''}"><div class="l">📦 งานค้าง</div><div class="v">${k.backlog}</div><div class="s">คลิปจากวันก่อน</div></div>
    <div class="kpi"><div class="l">✅ ช่องครบวันนี้</div><div class="v">${k.done}</div><div class="s">จาก ${k.channels} ช่อง</div></div>
  </div>
  <h2>📋 รายชื่อช่อง <span class="count">${ch.length}</span></h2>
  <div class="pages">${ch.map(c=>{const t=c.target&&c.today>=c.target?'green':c.backlog>=50?'red':'yellow';return `<div class="pg ${t}">
    <div class="top"><div class="name"><b class="pgn">${esc(c.short)}</b></div><span class="chip ${t}">${c.today}/${c.target} วันนี้</span></div>
    <div class="meta">ผู้ดูแล <b>${esc(c.owner||'—')}</b> · ${esc(c.category)} · ${esc(c.level)}${c.status?' · '+esc(c.status):''}</div>
    <div class="stats"><span>สัปดาห์ <b>${c.week}/${c.weekTarget}</b></span><span>ค้าง <b class="${c.backlog>=50?'bad':''}">${c.backlog}</b></span></div>
    ${c.url?`<div><button class="btn open" onclick="openUrl('${esc(c.url)}')">📂 เปิดไฟล์ช่อง</button></div>`:''}
  </div>`}).join('')}</div>`;
}
let LIVE=null, LIVE_BUSY=false;
async function loadLive(){
  if(LIVE_BUSY) return; LIVE_BUSY=true;
  try{const r=await api({action:'live'}); LIVE=r.ok?r:{error:r.error};}catch(e){LIVE={error:'เชื่อมต่อไม่ได้'}}
  LIVE_BUSY=false; if(DATA) render();
}
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
function liveView(){
  const head=`<div class="ghead"><h2>Shopee Live</h2><div class="meta">ช่องไลฟ์ Shopee · ข้อมูลจากรายงานไลฟ์ · ลงกะ/แลกกะ ทำในตารางไลฟ์ <a href="#" onclick="event.preventDefault();openUrl('https://liff.line.me/2012003271-5gshZD8d')">📅 เปิดตารางไลฟ์</a></div></div>`;
  if(!LIVE) return head+`<div class="empty">⏳ กำลังโหลดข้อมูลไลฟ์…</div>`;
  if(LIVE.error) return head+`<div class="empty">โหลดไม่ได้: ${esc(LIVE.error)} <button class="btn small" onclick="LIVE=null;loadLive();render()">ลองใหม่</button></div>`;
  const d=LIVE, ch=d.channels;
  let money='';
  if(d.admin){
    const tot=ch.reduce((a,c)=>({live7:a.live7+(c.live7||0),ads7:a.ads7+(c.ads7||0),coins7:a.coins7+(c.coins7||0),net7:a.net7+(c.net7||0),target:a.target+(c.target||0)}),{live7:0,ads7:0,coins7:0,net7:0,target:0});
    const avg=Math.round(tot.live7/7), pctT=tot.target?Math.round(avg/tot.target*100):0;
    money=`<div class="kpis share">
      <div class="kpi"><div class="l">💰 ค่าคอมไลฟ์เฉลี่ย/วัน</div><div class="v">${baht(avg)}</div><div class="s">เป้า ${baht(tot.target)} · ${pctT}%</div><div class="bar"><i style="width:${Math.min(100,pctT)}%"></i></div></div>
      <div class="kpi"><div class="l">📣 ค่าแอดไลฟ์ 7 วัน</div><div class="v">${baht(tot.ads7)}</div><div class="s">Coins ${baht(tot.coins7)}</div></div>
      <div class="kpi ${tot.net7<0?'alert':''}"><div class="l">🧮 สุทธิ 7 วัน</div><div class="v">${baht(tot.net7)}</div><div class="s">ค่าคอมทุกช่องทาง − แอด − Coins</div></div>
      <div class="kpi"><div class="l">📅 ข้อมูลถึง</div><div class="v" style="font-size:20px">${esc((d.latest||'—').split('-').reverse().join('/'))}</div><div class="s">ค่าคอมวันนี้ยังไม่ครบ</div></div>
    </div>`;
  }
  const cards=ch.map(c=>{
    if(!c.connected) return `<div class="pg gray"><div class="top"><div class="name"><b class="pgn">${c.name}</b></div><span class="chip gray">ยังไม่เชื่อมข้อมูล</span></div></div>`;
    if(!d.admin) return `<div class="pg green"><div class="top"><div class="name"><b class="pgn">${c.name}</b></div><span class="chip green">ข้อมูลถึง ${esc(c.last.split('-').reverse().join('/'))}</span></div></div>`;
    const p=c.target?Math.round(c.avg7/c.target*100):0, t=c.target?(p>=100?'green':p>=60?'yellow':'red'):'gray';
    const mx=Math.max(...c.trend,c.target||0,1);
    return `<div class="pg ${t}">
      <div class="top"><div class="name"><b class="pgn">${c.name}</b></div><span class="chip ${t}">${c.target?p+'% ของเป้า':'ยังไม่ตั้งเป้า'}</span></div>
      <div class="stats"><span>ค่าคอมไลฟ์เฉลี่ย <b>${baht(c.avg7)}</b>/วัน</span><span>เป้า <b>${baht(c.target)}</b></span></div>
      <div class="stats"><span>แอด 7 วัน <b>${baht(c.ads7)}</b></span><span>Coins <b>${baht(c.coins7)}</b></span><span>สุทธิ <b class="${c.net7<0?'bad':''}">${baht(c.net7)}</b></span></div>
      <div class="spark">${c.trend.map((v,i)=>`<i title="${d.days[i]}: ${baht(v)}" style="height:${Math.max(3,v/mx*100)}%"></i>`).join('')}${c.target?`<em style="bottom:${c.target/mx*100}%"></em>`:''}</div>
      <div class="meta">ค่าคอมไลฟ์รายวัน 14 วันล่าสุด · ข้อมูลถึง ${esc(c.last.split('-').reverse().join('/'))}</div>
    </div>`;}).join('');
  const ses=d.sessions.length?`<h2>🎥 ไลฟ์ล่าสุด <span class="count">${d.sessions.length}</span></h2>
    <div class="pglist">${d.sessions.map(x=>`<div class="pgi ${x.status==='live'?'red':''}"><span><b>${esc(x.channel)}</b> · ${esc(x.start)}<br><small>${x.hours.toFixed(1)} ชม. · ${x.orders} ออเดอร์${x.sales!=null?' · ยอด '+baht(x.sales):''}</small></span><span class="chip ${x.status==='live'?'red':'gray'}">${x.status==='live'?'🔴 กำลังไลฟ์':'จบแล้ว'}</span></div>`).join('')}</div>`:'';
  return head+money+`<h2>📋 รายชื่อช่อง <span class="count">${ch.length}</span></h2><div class="pages">${cards}</div>`+ses;
}
function soon(title,desc){return `<div class="ghead"><h2>${title}</h2></div><div class="empty">🚧 ${desc}<br><small>ยังไม่ได้เชื่อมข้อมูล · บอกได้ว่าจะให้ดึงจากไฟล์ไหน</small></div>`}

function render(){
  const d=DATA,me=d.me,isAdmin=me.role==='แอดมิน';
  if(PLAT==='users'&&!isAdmin) PLAT='meta';
  let body='';
  if(PLAT==='perf') body=perfView();
  else if(PLAT==='users') body=usersView();
  else if(PLAT==='meta') body=SUB==='fbA'?groupA():SUB==='fbB'?groupB(d):soon('FB Page Official','เพจทางการของแบรนด์/บริษัท');
  else if(PLAT==='shopee') body=SUB==='video'?videoView():liveView();
  else if(PLAT==='tiktok') body=soon('TikTok '+(SUB==='live'?'Live':'Video'),SUB==='live'?'ไลฟ์ TikTok ให้แบรนด์':'คลิปปักตะกร้า TikTok Affiliate');
  else body=soon('LINE OA','งาน LINE OA / บรอดแคสต์');
  const plats=Object.keys(NAVS).map(k=>[k,NAVS[k].icon+' '+NAVS[k].label]);
  plats.push(['perf','📈 ผลงาน']);
  if(isAdmin) plats.push(['users',`👤 ผู้ใช้${d.pendingUsers?` <span class="dot">${d.pendingUsers} รอ</span>`:''}`]);
  const subs=NAVS[PLAT]?NAVS[PLAT].subs:null;
  $app.innerHTML=`
  <header><div class="wrap">
    <img src="${esc(me.picture)}" alt="">
    <div><h1>สวัสดี ${esc(me.nick||me.lineName)} 👋</h1><div class="sub">${esc(me.role)} · อัปเดต ${esc(d.updated)}</div></div>
    <div class="sp"></div>
    <button class="btn ghost live" onclick="openUrl('https://liff.line.me/2012003271-5gshZD8d')">📅 ตารางไลฟ์</button>
    <button class="btn ghost" onclick="load();loadMyDay();if(PLAT==='meta'&&SUB==='fbA')loadShare();if(PLAT==='shopee'&&SUB==='video')loadVideo();if(PLAT==='shopee'&&SUB==='live')loadLive();if(PLAT==='perf')loadPerf()">↻</button>
  </div></header>
  <div class="wrap">
    <div class="tabs plat">${plats.map(t=>`<button class="${PLAT===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>
    ${myDayCard()}
    ${subs?`<div class="tabs subt">${subs.map(t=>`<button class="${SUB===t[0]?'on':''}" onclick="go('${PLAT}','${t[0]}')">${t[1]}</button>`).join('')}</div>`:''}
    ${body}
    <div class="foot">ข้อมูลอัปเดตจากไฟล์งานแต่ละเพจ/ช่อง · บันทึกงานที่ไฟล์ แล้วกด ↻ เพื่อดูสถานะใหม่</div>
  </div>`;
}

function homeView(d){
  const order={red:0,yellow:1,orange:2,green:3,gray:4};
  const pages=[...d.pages].sort((a,b)=>order[tone(a.status)]-order[tone(b.status)]);
  const max=Math.max(d.dailyTarget,...d.trend.map(t=>t.posted),1);
  return `
  <h2>📋 สถานะรายเพจ <span class="count">${pages.length}</span></h2>
  <div class="pages">${pages.map(p=>`
    <div class="pg ${tone(p.status)}">
      <div class="top"><div class="name">${pageLink(p.name,p.fb)}</div><span class="chip ${tone(p.status)}">${esc(p.status)}</span></div>
      <div class="todo">👉 ${esc(p.todo)}</div>
      <div class="stats">
        <span>วันนี้ <b>${esc(p.doneTarget)}</b></span><span>7 วัน <b>${esc(p.week)}</b></span>
        <span>เลยกำหนด <b class="${p.overdue?'r':''}">${p.overdue}</b></span><span>ปัญหา <b class="${p.issues?'r':''}">${p.issues}</b></span>
        <span>รอล่วงหน้า <b>${p.ahead}</b></span><span>ลงล่าสุด <b>${esc(p.last)}</b></span>
      </div>
      <div><button class="btn open" onclick="openUrl('${esc(p.url)}')">📂 เปิดไฟล์ ${esc(p.name)}</button></div>
    </div>`).join('')}</div>
  <h2>📈 ลงคลิป 14 วันล่าสุด</h2>
  <div class="chart">
    <div class="cols">
      <div class="tg" style="bottom:${d.dailyTarget/max*100}%"><em>เป้า ${d.dailyTarget}</em></div>
      ${d.trend.map(t=>`<div class="c"><span>${t.posted||''}</span><i style="height:${t.posted/max*100}%"></i></div>`).join('')}
    </div>
    <div class="xl">${d.trend.map(t=>`<span>${esc(t.label)}</span>`).join('')}</div>
  </div>`;
}

function tasksView(d){
  if(!d.tasks.length) return `<h2>🎬 งานที่ต้องลงวันนี้</h2><div class="empty">ไม่มีงานต้องลงตอนนี้ 🎉</div>`;
  const list=[...d.tasks].sort((a,b)=>(b.due.startsWith('เลย')?1:0)-(a.due.startsWith('เลย')?1:0));
  return `<h2>🎬 งานที่ต้องลงวันนี้ <span class="count">${list.length}</span></h2>
  ${list.map((t,i)=>`
    <div class="task ${t.due.startsWith('เลย')?'over':''}">
      <div class="h"><div class="t">${esc(t.title)}</div><span class="chip ${t.due.startsWith('เลย')?'red':'yellow'}">${esc(t.due)}</span></div>
      <div class="meta">${pageLink(t.page,t.fb)} · แถว ${esc(t.no)} · ${esc(t.format)} · สถานะ ${esc(t.status)}${t.product?' · 🛒 '+esc(t.product):''}</div>
      <div class="acts">
        ${t.clip&&t.clip.startsWith('http')?`<button class="btn small" onclick="openUrl('${esc(t.clip)}')">🎞️ คลิป</button>`:'<span class="chip red">ยังไม่มีไฟล์คลิป</span>'}
        ${t.cover&&t.cover.startsWith('http')?`<button class="btn small" onclick="openUrl('${esc(t.cover)}')">🖼️ ปก</button>`:''}
        ${t.caption?`<button class="btn small" onclick="copy(DATA.tasks[${d.tasks.indexOf(t)}].caption,'แคปชัน')">📋 คัดลอกแคปชัน</button>`:''}
        ${t.subLink?`<button class="btn sub" onclick="copy(DATA.tasks[${d.tasks.indexOf(t)}].subLink,'ลิงก์ Sub ID')">🔗 คัดลอกลิงก์ Sub ID</button>`:(t.product?`<span class="chip orange">⏳ ยังไม่มีลิงก์ Sub ID</span>`:'')}
        <button class="btn open" onclick="openUrl('${esc(t.url)}')">📂 บันทึกในไฟล์เพจ</button>
      </div>
      ${t.subLink?`<div class="sublink" onclick="copy(DATA.tasks[${d.tasks.indexOf(t)}].subLink,'ลิงก์ Sub ID')">🔗 ${esc(t.subLink)}</div>`:(t.product?`<div class="meta">👉 กด "บันทึกในไฟล์เพจ" สร้างลิงก์ติด Sub ID ในช่อง Q แล้วกลับมาหน้านี้ ปุ่มคัดลอกจะขึ้นเอง</div>`:'')}
      ${t.caption?`<details><summary>ดูแคปชัน / หมายเหตุ</summary><div class="cap">${esc(t.caption)}</div>${t.note?`<div class="meta">📝 ${esc(t.note)}</div>`:''}</details>`:''}
    </div>`).join('')}`;
}

function probsView(d){
  if(!d.problems.length) return `<h2>⚠️ งานมีปัญหา</h2><div class="empty">ไม่มีงานมีปัญหา 🎉</div>`;
  return `<h2>⚠️ งานมีปัญหา <span class="count">${d.problems.length}</span></h2>
  ${d.problems.map(p=>`
    <div class="prob">
      <span class="chip ${p.level.startsWith('🔴')?'red':'orange'}">${esc(p.level)}</span>
      <div class="i"><b>${esc(p.title)}</b><br>${pageLink(p.page,p.fb)} · แถว ${esc(p.no)} · ${esc(p.status)}<br><span class="w">${esc(p.issue)}</span></div>
      <button class="btn open" onclick="openUrl('${esc(p.url)}')">📂 แก้</button>
    </div>`).join('')}`;
}

boot();
</script>
